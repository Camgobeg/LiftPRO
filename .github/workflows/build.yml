name: Build LiftPRO

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.20.1 build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Validate resource JSON
        run: python3 scripts/validate_resources.py

      - name: Build and test
        run: gradle --no-daemon --stacktrace clean test build

      - name: Upload Forge mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: LiftPRO-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
