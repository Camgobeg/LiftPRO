name: Build LiftPRO
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate resources
        run: python3 - <<'PY'
import json
from pathlib import Path
for path in Path("src/main/resources").rglob("*.json"):
    json.loads(path.read_text(encoding="utf-8"))
print("All resource JSON files are valid.")
PY
      - name: Build and test
        run: gradle --no-daemon clean test build
      - name: Upload Forge mod
        uses: actions/upload-artifact@v4
        with:
          name: LiftPRO-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
